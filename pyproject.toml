[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "binary-cli"
version = "0.2.0"
description = "A modular, provider-independent LLM command-line assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "platformdirs>=4.2.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
openai = ["openai>=1.30.0"]
dev = ["pytest>=8.2.0", "ruff>=0.4.0"]

[project.scripts]
binary = "binary_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/binary_cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/binary_cli/main.py" = ["BLE001", "B008"]
